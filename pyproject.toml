[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pictologics-benchmark"
version = "1.0.0"
description = "Calculation-only timing benchmark and IBSI conformance of five Python radiomics libraries"
authors = [{name = "Márton Kolossváry"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0,<7.0",
  "psutil>=5.9,<6.0",
  "matplotlib>=3.8,<4.0",
  "pandas>=2.0.0,<3.0.0",
  "numpy>=1.23,<2.0",
  "nibabel>=5.2,<6.0",
  "scipy>=1.11.0,<2.0",
  "openpyxl>=3.1.5,<4.0",
]

[project.urls]
Repository = "https://github.com/martonkolossvary/pictologics-benchmark"

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.15.22,<0.16.0",
]

[tool.poetry]
packages = [{include = "bench"}]
