name: submission-check

# Checks a pull request that adds a result package.  The validator and the
# list of accepted releases come from the base branch; the pull request's
# files are read only as data.
on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Allow only new result packages
        id: folders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json files --jq '.files[].path')
          bad=$(printf '%s\n' "$files" | grep -Ev '^submissions/[A-Za-z0-9][A-Za-z0-9._-]*/[0-9]{4}-[0-9]{2}-[0-9]{2}/' || true)
          if [ -n "$bad" ]; then
            echo "This pull request may change only submissions/<machine-id>/<date>/:"
            echo "$bad"
            exit 1
          fi
          printf '%s\n' "$files" | cut -d/ -f1-3 | sort -u > folders.txt
          cat folders.txt
      - name: Validate each package
        run: |
          status=0
          while read -r folder; do
            echo "== $folder"
            python -I base/bench/submission/validate.py base "pr/$folder" || status=1
          done < folders.txt
          exit $status
